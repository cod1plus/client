name: Release

# Builds mss32.dll and attaches the assets to the release automatically.
#  - fires when you PUBLISH a release on GitHub (uses that release's tag), or
#  - run it by hand (Actions tab -> Release -> Run workflow) for an existing tag.
#
# Uses the stable Ubuntu i686-w64-mingw32 cross-compiler (the rolling msys2
# toolchain on windows runners ships a broken bleeding-edge gcc that fails to
# static-link, hence the cross-compile here).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build + attach assets to (e.g. 1.6.0)"
        required: true

permissions:
  contents: write   # required for gh release upload via GITHUB_TOKEN

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG#v}"                       # strip a leading 'v' if present
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building cod1reloaded $TAG"

      - name: Install 32-bit MinGW (stable) + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686 cmake zip
          # match the local toolchain's POSIX threading model
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix || true

      - name: Build mss32.dll
        run: |
          # keep the compiled version in sync with the release tag
          sed -i "s/COD1RELOADED_VERSION = \"[^\"]*\"/COD1RELOADED_VERSION = \"$TAG\"/" src/features/updater.h
          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres
          cmake --build build --target mss32 -j
          test -f build/mss32.dll

      - name: Build mss32.dll (no-rinput variant)
        run: |
          # Second variant, shipped since 1.6.5: the raw-input GetCursorPos hook is
          # compiled out entirely, so the engine's mouse path is exactly vanilla and an
          # external RInput is the only thing in the chain. The DLL cannot be renamed (it
          # is a proxy), so the variants are separated by output DIRECTORY - see the
          # COD1RELOADED_OUTPUT_DIR block in CMakeLists.txt.
          cmake -S . -B build-norinput \
            -DCOD1RELOADED_NO_RINPUT=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=i686-w64-mingw32-windres
          cmake --build build-norinput --target mss32 -j
          test -f build/norinput/mss32.dll
          # Prove the two are really different before they are packaged: the standard one
          # must carry the hook string, the other must not.
          grep -q "GetCursorPos IAT hook installed" build/mss32.dll
          ! grep -q "GetCursorPos IAT hook installed" build/norinput/mss32.dll

      - name: Build the 1.6X menu pk3
        run: |
          # zz_cod1x_ui.pk3 is generated from ui_pk3/ui_mp/*.menu. *.pk3 is gitignored, so
          # it is built here rather than committed. WITHOUT THIS STEP the release ships a
          # client whose settings menu has no menu files behind it.
          python3 ui_pk3/build_pk3.py
          test -f dist/zz_cod1x_ui.pk3

      - name: Package assets
        run: |
          mkdir -p dist
          cp build/mss32.dll cod1reloaded.ini dist/
          printf '{\n  "version": "%s",\n  "download_url": "https://github.com/%s/releases/latest/download/mss32.dll",\n  "notes": "cod1reloaded %s - see CHANGELOG"\n}\n' \
            "$TAG" "$GITHUB_REPOSITORY" "$TAG" > dist/manifest.json
          # mirror the game folder layout so the zip extracts straight over it
          ( cd dist && mkdir -p Main && cp zz_cod1x_ui.pk3 Main/ \
            && zip -q "cod1reloaded-$TAG.zip" mss32.dll cod1reloaded.ini Main/zz_cod1x_ui.pk3 )
          # No-rinput variant. Release assets must have unique names, so the loose DLL is
          # published as mss32-norinput.dll - but INSIDE its zip it is mss32.dll, because
          # that is the name the game must load. Extract the zip over the game folder.
          cp build/norinput/mss32.dll dist/mss32-norinput.dll
          ( cd dist && mkdir -p norinput/Main && cp ../build/norinput/mss32.dll norinput/mss32.dll \
            && cp cod1reloaded.ini norinput/ && cp zz_cod1x_ui.pk3 norinput/Main/ \
            && cd norinput && zip -q "../cod1reloaded-$TAG-norinput.zip" \
                 mss32.dll cod1reloaded.ini Main/zz_cod1x_ui.pk3 )
          ls -l dist

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            dist/mss32.dll \
            dist/cod1reloaded.ini \
            dist/manifest.json \
            dist/zz_cod1x_ui.pk3 \
            "dist/cod1reloaded-$TAG.zip" \
            dist/mss32-norinput.dll \
            "dist/cod1reloaded-$TAG-norinput.zip" \
            --clobber
